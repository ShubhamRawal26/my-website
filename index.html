<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Glass Step Form</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="bg-circle bg-black"></div>
    <div class="bg-circle bg-red"></div>

    <div class="glass-card">
        <div class="card-header">
            <div class="header-left">Glass<br>morphic effect</div>
            <div class="header-right" id="step-indicator">Step 1/4</div>
        </div>

        <div class="form-container">
            <div class="step active" id="step-1">
                <h1>Hello,<br>What is your<br>Name?</h1>
                <input type="text" id="name" placeholder="e.g. Zero" autocomplete="off">
                <button class="action-btn" onclick="nextStep(1)">Next ➔</button>
            </div>

            <div class="step" id="step-2">
                <h1>Great,<br>Your Mobile<br>Number?</h1>
                <input type="tel" id="mobile" placeholder="e.g. 1234567890" autocomplete="off">
                <button class="action-btn" onclick="nextStep(2)">Next ➔</button>
            </div>

            <div class="step" id="step-3">
                <h1>Awesome,<br>What's your<br>Email?</h1>
                <input type="email" id="email" placeholder="e.g. zero@example.com" autocomplete="off">
                <button class="action-btn" onclick="nextStep(3)">Next ➔</button>
            </div>

            <div class="step" id="step-4">
                <h1>Almost done,<br>Your<br>Class?</h1>
                <input type="text" id="class" placeholder="e.g. 10th / BCA" autocomplete="off">
                <button class="action-btn submit-btn" onclick="submitForm()">Submit ✔</button>
            </div>

            <div class="step" id="step-result">
                <h1 style="font-size: 28px; margin-bottom: 20px;">Profile<br>Complete.</h1>
                <div class="result-details">
                    <p><span>Name:</span> <strong id="res-name"></strong></p>
                    <p><span>Mobile:</span> <strong id="res-mobile"></strong></p>
                    <p><span>Email:</span> <strong id="res-email"></strong></p>
                    <p><span>Class:</span> <strong id="res-class"></strong></p>
                </div>
                <button class="action-btn outline-btn" onclick="location.reload()">Restart</button>
            </div>
        </div>

        <div class="card-footer">
            @_Your_Handle
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
