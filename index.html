<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Glass Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="glass-card" id="form-card">
            <div class="mac-controls">
                <span class="dot close"></span>
                <span class="dot minimize"></span>
                <span class="dot expand"></span>
            </div>
            <h2>Your Information</h2>
            <form id="user-form">
                <div class="input-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" placeholder="Zero" required>
                </div>
                <div class="input-group">
                    <label for="mobile">Mobile Number</label>
                    <input type="tel" id="mobile" placeholder="1234567890" required>
                </div>
                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="zero@example.com" required>
                </div>
                <div class="input-group">
                    <label for="class">Class</label>
                    <input type="text" id="class" placeholder="e.g. 10th / BCA" required>
                </div>
                <button type="submit">Submit</button>
            </form>
        </div>

        <div class="glass-card hidden" id="result-card">
            <div class="mac-controls">
                <span class="dot close"></span>
                <span class="dot minimize"></span>
                <span class="dot expand"></span>
            </div>
            <h2>Premium Profile</h2>
            <div class="profile-details">
                <p><strong>Name:</strong> <span id="res-name"></span></p>
                <p><strong>Mobile:</strong> <span id="res-mobile"></span></p>
                <p><strong>Email:</strong> <span id="res-email"></span></p>
                <p><strong>Class:</strong> <span id="res-class"></span></p>
            </div>
            <button id="reset-btn" class="secondary-btn">Go Back</button>
        </div>
    </div>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</body>
</html>
