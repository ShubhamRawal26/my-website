<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Designer Glass Form & Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <button class="admin-login-btn" onclick="window.adminLogin()">Admin Sign In</button>

    <div class="circle-black"></div>
    <div class="circle-red"></div>

    <div class="glass-container" id="main-form-container">
        <div class="top-text">
            <span class="left-text">Glass<br>morphic effect</span>
            <span class="right-text" id="step-count">Let's create</span>
        </div>

        <div class="steps-wrapper">
            <div class="step active" id="step-1">
                <h1 class="main-heading">Hello,<br>What is your<br>Name?</h1>
                <input type="text" id="userName" class="glass-input" placeholder="e.g. Zero" autocomplete="off">
                <button class="next-btn" onclick="window.goToNext(1, 'userName')">Next ➔</button>
            </div>

            <div class="step" id="step-2">
                <h1 class="main-heading">Great,<br>Your Mobile<br>Number.</h1>
                <input type="tel" id="userMobile" class="glass-input" placeholder="e.g. 1234567890" autocomplete="off">
                <button class="next-btn" onclick="window.goToNext(2, 'userMobile')">Next ➔</button>
            </div>

            <div class="step" id="step-3">
                <h1 class="main-heading">Awesome,<br>Your<br>Email.</h1>
                <input type="email" id="userEmail" class="glass-input" placeholder="e.g. zero@example.com" autocomplete="off">
                <button class="next-btn" onclick="window.goToNext(3, 'userEmail')">Next ➔</button>
            </div>

            <div class="step" id="step-4">
                <h1 class="main-heading">Lastly,<br>Your<br>Class.</h1>
                <input type="text" id="userClass" class="glass-input" placeholder="e.g. BCA / 10th" autocomplete="off">
                <button class="next-btn" id="submitBtn" onclick="window.submitData()">Submit ✔</button>
            </div>

            <div class="step" id="step-result">
                <h1 class="main-heading" style="font-size: 32px;">Profile<br>Completed.</h1>
                <div class="result-box">
                    <p>Name: <strong id="res-name"></strong></p>
                    <p>Mobile: <strong id="res-mobile"></strong></p>
                    <p>Email: <strong id="res-email"></strong></p>
                    <p>Class: <strong id="res-class"></strong></p>
                </div>
                <button class="next-btn restart-btn" onclick="location.reload()">Restart</button>
            </div>
        </div>

        <div class="bottom-text">
            @NexGenDigital.Tech
        </div>
    </div>

    <div class="glass-container hidden-panel" id="admin-dashboard">
        <div class="admin-header">
            <h2>Admin Dashboard</h2>
            <button class="next-btn admin-btn" onclick="window.adminLogout()">Logout</button>
        </div>
        <p style="margin-bottom: 15px; opacity: 0.8;">Total Responses: <span id="total-count">0</span></p>
        
        <div class="admin-controls">
            <input type="text" id="searchInput" class="glass-input" placeholder="Search by name or email..." onkeyup="window.searchResponses()">
            <button class="next-btn admin-btn" onclick="window.fetchResponses()">Refresh</button>
        </div>

        <div class="response-grid" id="response-list">
            </div>
    </div>

    <script type="module" src="firebase-config.js"></script>
    <script type="module" src="auth.js"></script>
    <script type="module" src="admin.js"></script>
    <script type="module" src="script.js"></script>
</body>
</html>
